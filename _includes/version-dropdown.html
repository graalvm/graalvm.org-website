<input name="select_value" type="hidden" id="selectedValue">
<div class="display-value display-version" id="displayValue" onclick="toggleOptions(event)">
  <span class="value-text" id="valueText">Version</span>
</div>
<ul tabindex="0" class="select-container" id="selectContainer" onblur="toggleOptions(event)">
  <li class="select-option" data-current-innovation data-versions="latest" onclick="location='/latest/docs/'">GraalVM Innovation</li>
  <li class="select-option" data-versions="jdk25" onclick="location='/jdk25/docs/'">GraalVM 25.0</li>
  <li class="select-option" data-versions="jdk21" onclick="location='/jdk21/docs/'">GraalVM for JDK 21</li>
  <li class="select-option" data-versions="jdk17" onclick="location='/jdk17/docs/'">GraalVM for JDK 17</li>
  <li class="select-option" data-versions="dev" onclick="window.open('https://github.com/oracle/graal/tree/master/docs', '_blank').focus()">Dev Build</li>
</ul>
