version: 2

multi-ecosystem-groups:
  update-gha:
    schedule:
      interval: 'monthly'
  update-bundler:
    schedule:
      interval: 'monthly'

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'update-gha'
    cooldown:
      default-days: 7

  - package-ecosystem: 'bundler'
    directory: '/'
    patterns: ['*']
    multi-ecosystem-group: 'update-bundler'
    cooldown:
      default-days: 7
