name: Deploy graalvm.org/webassembly

on: [workflow_dispatch]

# Grant write access only to the deploy job.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "graalwasm-website"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GraalWasm repository
        uses: actions/checkout@v7.0.1
        with:
          repository: oracle/graal
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: '3.2'
      - name: Install website dependencies
        working-directory: wasm/docs/site
        run: bundle install
      - name: Build website
        working-directory: wasm/docs/site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: wasm/docs/site/_site

  deploy:
    # Deploy only explicitly from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out GraalVM website repository
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
      - name: Download website artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/graalwasm-artifact
      - name: Update GraalWasm website
        run: |
          mkdir -p "$RUNNER_TEMP/graalwasm-site"
          tar -xf "$RUNNER_TEMP/graalwasm-artifact/artifact.tar" -C "$RUNNER_TEMP/graalwasm-site"
          rsync -a --delete "$RUNNER_TEMP/graalwasm-site/" webassembly/
      - name: Commit and push website changes
        run: |
          git add --all -- webassembly/
          
          if git diff --cached --quiet -- webassembly/; then
            echo "No GraalWasm website changes to commit."
            exit 0
          fi
          git diff --cached --name-status

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GraalWasm website on $(date)"
          git push origin gh-pages
